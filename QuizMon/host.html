<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuizMon – Тоглоом удирдах</title>
<link rel="stylesheet" href="css/main.css">
<style>
  .host-layout { display:grid; grid-template-columns:1fr 320px; gap:16px; padding:12px 0 80px; max-width:960px; margin:0 auto; }
  @media(max-width:720px){ .host-layout{ grid-template-columns:1fr; } }
  .players-box { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; }
  .players-box h3 { margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; font-size:.95rem; }
  .cnt-badge { background:var(--accent); color:#fff; border-radius:999px; padding:2px 10px; font-size:.8rem; font-weight:700; }
</style>
</head>
<body>

<nav class="nav">
  <a class="nav-brand" href="dashboard.html">🏆 QuizMon</a>
  <div class="nav-actions">
    <span class="nav-user" id="codeLabel"></span>
    <button class="btn btn-danger sm" id="endBtn">Дуусгах</button>
  </div>
</nav>

<!-- ══ LOBBY ══ -->
<div id="viewLobby">
  <div style="max-width:620px;margin:0 auto;padding:32px 16px;text-align:center">
    <p class="muted" style="margin-bottom:4px">Нэгдэх код</p>
    <div class="game-code-big" id="lobbyCode"></div>
    <p class="muted" style="font-size:.85rem;margin:8px 0 20px">QR кодыг утасны камераар уншуулна уу</p>
    <div class="qr-wrap"><canvas id="qrCanvas"></canvas></div>
    <div class="player-count" id="playerCount" style="margin:12px 0">👤 0 / 40 сурагч нэгдсэн</div>
    <div class="player-chips" id="playerChips"></div>
    <div style="margin-top:24px">
      <button class="btn btn-success large" id="startBtn" disabled>▶ Тоглоом эхлүүлэх</button>
      <p class="muted" style="margin-top:6px;font-size:.8rem">Дор хаяж 1 сурагч нэгдсэн байх ёстой</p>
    </div>
  </div>
</div>

<!-- ══ GAME ══ -->
<div id="viewGame" class="hidden">
  <div class="container">
    <div class="host-layout">
      <div style="display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px">
          <span class="q-progress" id="qProgress">Асуулт 1 / 10</span>
          <span class="muted" style="font-size:.85rem" id="answeredCount">0 хариулсан</span>
        </div>
        <div class="host-question-card">
          <div class="host-q-text" id="hostQText"></div>
          <div class="host-timer" id="hostTimer">60</div>
        </div>
        <div class="host-options" id="hostOptions"></div>
        <div style="text-align:center" id="nextBtnWrap" class="hidden">
          <button class="btn btn-primary large" id="nextBtn">Дараагийн асуулт →</button>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div class="players-box">
          <h3>🏅 Шуурхай оноо <span class="cnt-badge" id="liveCnt">0</span></h3>
          <div id="liveLb"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ══ FINAL ══ -->
<div id="viewEnd" class="hidden">
  <div class="lb-wrap">
    <div class="lb-title" style="margin-bottom:24px">
      <div style="font-size:3rem;margin-bottom:8px">🏆</div>
      <h1>Тоглоом дууслаа!</h1>
      <p class="muted" id="endGameTitle"></p>
    </div>
    <div id="finalLb"></div>
    <div style="text-align:center;margin-top:24px">
      <a href="dashboard.html" class="btn btn-primary large">← Хяналтын самбар</a>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="js/config.js"></script>
<script>
  const params     = new URLSearchParams(location.search);
  const GAME_CODE  = params.get('code');
  if (!GAME_CODE) window.location.href = 'dashboard.html';

  const OPT_LBL  = ['A','B','C','D'];
  const OPT_ICON = ['♦','■','▲','●'];
  const MEDALS   = ['🥇','🥈','🥉'];

  let gameData      = null;
  let playerMap     = {};
  let timerInterval = null;
  let reviewDone    = false; // prevent double advance

  document.getElementById('codeLabel').textContent = 'Код: ' + GAME_CODE;

  // ── Auth ──
  auth.onAuthStateChanged(user => {
    if (!user) { window.location.href = 'index.html'; return; }
    initHost(user);
  });

  async function initHost(user) {
    const snap = await db.collection('games').doc(GAME_CODE).get();
    if (!snap.exists || snap.data().teacherId !== user.uid) {
      alert('Тоглоом олдсонгүй.'); window.location.href = 'dashboard.html'; return;
    }
    gameData = snap.data();
    document.getElementById('lobbyCode').textContent = GAME_CODE;

    // QR — point to join.html in same origin
    const joinURL = location.origin + location.pathname.replace('host.html','') + 'join.html?code=' + GAME_CODE;
    QRCode.toCanvas(document.getElementById('qrCanvas'), joinURL,
      { width:220, margin:1, color:{dark:'#1a1a2e',light:'#e8ebf2'} });

    showView('lobby');

    // Real-time: players
    db.collection('games').doc(GAME_CODE).collection('players')
      .onSnapshot(snap => {
        playerMap = {};
        snap.forEach(d => { playerMap[d.id] = d.data(); });
        onPlayersChange();
      });

    // Real-time: game state
    db.collection('games').doc(GAME_CODE)
      .onSnapshot(snap => {
        if (!snap.exists) return;
        const prev = gameData ? gameData.status : null;
        gameData = snap.data();
        if (gameData.status === 'question' && prev !== 'question') onQuestionActive();
        if (gameData.status === 'review'   && prev !== 'review')   onReview();
        if (gameData.status === 'ended'    && prev !== 'ended')     onGameEnded();
      });
  }

  // ── Players change ──
  function onPlayersChange() {
    const count = Object.keys(playerMap).length;
    document.getElementById('playerCount').textContent = `👤 ${count} / 40 сурагч нэгдсэн`;
    document.getElementById('startBtn').disabled = count === 0;
    document.getElementById('playerChips').innerHTML = Object.values(playerMap)
      .map(p => `<span class="player-chip">${p.avatar||'👤'} ${esc(p.name)}</span>`).join('');
    renderLiveLb();

    // Check if everyone answered during question
    if (gameData && gameData.status === 'question' && !reviewDone) {
      const qIdx = gameData.currentQuestion;
      const ans  = Object.values(playerMap).filter(p => p.answers && p.answers[qIdx] !== undefined).length;
      document.getElementById('answeredCount').textContent = `${ans} / ${count} хариулсан`;
      if (ans > 0 && ans >= count) advanceToReview();
    }
  }

  // ── Start game ──
  document.getElementById('startBtn').addEventListener('click', () => startQuestion(0));

  async function startQuestion(idx) {
    reviewDone = false;
    clearInterval(timerInterval);
    await db.collection('games').doc(GAME_CODE).update({
      status: 'question',
      currentQuestion: idx,
      questionStartedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }

  // ── Question active ──
  function onQuestionActive() {
    showView('game');
    reviewDone = false;
    const idx  = gameData.currentQuestion;
    const q    = gameData.questions[idx];
    document.getElementById('qProgress').textContent = `Асуулт ${idx+1} / ${gameData.totalQuestions}`;
    document.getElementById('hostQText').textContent = q.text;
    document.getElementById('nextBtnWrap').classList.add('hidden');
    document.getElementById('answeredCount').textContent = '0 хариулсан';

    // Render option boxes
    document.getElementById('hostOptions').innerHTML = OPT_LBL.map((lbl, j) =>
      `<div class="host-opt host-opt-${lbl.toLowerCase()}" id="opt${j}">
         <span>${OPT_ICON[j]}</span>
         <span style="flex:1">${esc(q.options[j])}</span>
         <span class="opt-count" id="optCnt${j}">0</span>
       </div>`).join('');

    // 60s countdown
    let t = 60;
    const timerEl = document.getElementById('hostTimer');
    timerEl.textContent = t;
    timerEl.className = 'host-timer';
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      t--;
      timerEl.textContent = t;
      if (t <= 10) timerEl.classList.add('low');
      if (t <= 0) { clearInterval(timerInterval); advanceToReview(); }
    }, 1000);
  }

  async function advanceToReview() {
    if (reviewDone) return;
    reviewDone = true;
    clearInterval(timerInterval);
    await db.collection('games').doc(GAME_CODE).update({ status: 'review' });
  }

  // ── Review ──
  function onReview() {
    clearInterval(timerInterval);
    const idx = gameData.currentQuestion;
    const q   = gameData.questions[idx];

    // Tally per option
    const tally = [0,0,0,0];
    Object.values(playerMap).forEach(p => {
      if (p.answers && p.answers[idx] !== undefined) tally[p.answers[idx].optionIndex]++;
    });
    tally.forEach((cnt, j) => {
      const el = document.getElementById('optCnt' + j);
      if (el) el.textContent = cnt;
      const box = document.getElementById('opt' + j);
      if (!box) return;
      if (j === q.correctIndex) { box.style.outline = '3px solid #fff'; box.insertAdjacentHTML('beforeend','<span style="margin-left:4px">✅</span>'); }
      else box.style.opacity = '.35';
    });

    renderLiveLb();

    // Next or end
    const isLast = idx >= gameData.totalQuestions - 1;
    const btn    = document.getElementById('nextBtn');
    btn.textContent = isLast ? '🏆 Дүн харах' : 'Дараагийн асуулт →';
    btn.onclick     = isLast ? endGame : () => startQuestion(idx + 1);
    document.getElementById('nextBtnWrap').classList.remove('hidden');
  }

  async function endGame() {
    clearInterval(timerInterval);
    await db.collection('games').doc(GAME_CODE).update({ status: 'ended' });
  }

  // ── Game ended ──
  function onGameEnded() {
    showView('end');
    document.getElementById('endGameTitle').textContent = gameData.title || '';
    const sorted = Object.values(playerMap).sort((a,b) => (b.totalScore||0) - (a.totalScore||0));
    document.getElementById('finalLb').innerHTML = sorted.map((p,i) =>
      `<div class="lb-item ${i<3?'rank-'+(i+1):''}">
         <span class="lb-rank">${MEDALS[i]||'#'+(i+1)}</span>
         <span class="lb-avatar">${p.avatar||'👤'}</span>
         <span class="lb-name">${esc(p.name)}</span>
         <span class="lb-score">${p.totalScore||0} оноо</span>
       </div>`).join('');
  }

  // ── Live leaderboard ──
  function renderLiveLb() {
    const sorted = Object.values(playerMap).sort((a,b) => (b.totalScore||0) - (a.totalScore||0)).slice(0,8);
    document.getElementById('liveCnt').textContent = Object.keys(playerMap).length;
    document.getElementById('liveLb').innerHTML = sorted.length
      ? sorted.map((p,i) =>
          `<div class="lb-item" style="padding:8px 10px;margin-bottom:6px">
             <span class="lb-rank" style="font-size:1.1rem">${MEDALS[i]||'#'+(i+1)}</span>
             <span style="font-size:1.3rem">${p.avatar||'👤'}</span>
             <span style="flex:1;font-size:.9rem;font-weight:600">${esc(p.name)}</span>
             <span style="font-weight:800;color:var(--accent)">${p.totalScore||0}</span>
           </div>`).join('')
      : '<p class="muted" style="font-size:.82rem">Оноо хуримтлагдаагүй</p>';
  }

  // ── End btn ──
  document.getElementById('endBtn').addEventListener('click', async () => {
    if (!confirm('Тоглоомыг дуусгах уу?')) return;
    await endGame();
  });

  // ── Helpers ──
  function showView(n) {
    ['Lobby','Game','End'].forEach(v =>
      document.getElementById('view'+v).classList.toggle('hidden', v.toLowerCase() !== n));
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
</script>
</body>
</html>
