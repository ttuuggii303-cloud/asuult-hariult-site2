<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuizMon – Нэвтрэх</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body class="auth-page">

<div class="auth-wrapper">
  <div class="auth-logo">
    <div class="logo-icon">🏆</div>
    <h1>QuizMon</h1>
    <p>Багш нарт зориулсан онлайн асуулт тоглоом</p>
  </div>

  <div class="auth-card">
    <div class="tabs">
      <button class="tab active" data-tab="login">Нэвтрэх</button>
      <button class="tab"        data-tab="register">Бүртгүүлэх</button>
    </div>

    <!-- ── Login ── -->
    <div id="login-tab">
      <div class="form-group">
        <label>Имэйл</label>
        <input type="email" id="loginEmail" placeholder="email@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Нууц үг</label>
        <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button class="btn btn-primary full large" id="loginBtn">Нэвтрэх</button>
    </div>

    <!-- ── Register ── -->
    <div id="register-tab" hidden>
      <div class="form-group">
        <label>Нэр</label>
        <input type="text" id="regName" placeholder="Таны нэр">
      </div>
      <div class="form-group">
        <label>Имэйл</label>
        <input type="email" id="regEmail" placeholder="email@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Нууц үг (6+ тэмдэгт)</label>
        <input type="password" id="regPass" placeholder="••••••••" autocomplete="new-password">
      </div>
      <button class="btn btn-primary full large" id="regBtn">Бүртгүүлэх</button>
    </div>

    <div id="authMsg" class="alert hidden"></div>
  </div>

  <!-- Student shortcut -->
  <p style="margin-top:24px;color:var(--muted);font-size:.9rem">
    Сурагч уу? <a href="join.html" style="color:var(--accent);font-weight:600">QR кодоор нэгд →</a>
  </p>
</div>

<!-- Firebase SDKs (compat) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script>
  // ── Tab switching ──
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      document.getElementById('login-tab').hidden    = t.dataset.tab !== 'login';
      document.getElementById('register-tab').hidden = t.dataset.tab !== 'register';
      document.getElementById('authMsg').classList.add('hidden');
    });
  });

  function showMsg(msg, type = 'error') {
    const el = document.getElementById('authMsg');
    el.textContent = msg;
    el.className = 'alert alert-' + type;
  }
  function setLoading(id, on) {
    const btn = document.getElementById(id);
    btn.disabled = on;
    btn.textContent = on ? '⏳ Түр хүлээнэ үү...' : (id === 'loginBtn' ? 'Нэвтрэх' : 'Бүртгүүлэх');
  }

  // ── Redirect if already signed in ──
  auth.onAuthStateChanged(async user => {
    if (user) window.location.href = 'dashboard.html';
  });

  // ── Login ──
  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value.trim();
    const pass  = document.getElementById('loginPass').value;
    if (!email || !pass) { showMsg('Имэйл болон нууц үгийг бөглөнө үү.'); return; }
    setLoading('loginBtn', true);
    try {
      await auth.signInWithEmailAndPassword(email, pass);
      window.location.href = 'dashboard.html';
    } catch(e) {
      showMsg('Нэвтрэх алдаа: ' + e.message);
      setLoading('loginBtn', false);
    }
  });

  // ── Register ──
  document.getElementById('regBtn').addEventListener('click', async () => {
    const name  = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const pass  = document.getElementById('regPass').value;
    if (!name || !email || !pass) { showMsg('Бүх талбарыг бөглөнө үү.'); return; }
    if (pass.length < 6) { showMsg('Нууц үг 6+ тэмдэгт байх ёстой.'); return; }
    setLoading('regBtn', true);
    try {
      const cred = await auth.createUserWithEmailAndPassword(email, pass);
      await db.collection('users').doc(cred.user.uid).set({
        displayName: name, email, role: 'teacher',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      window.location.href = 'dashboard.html';
    } catch(e) {
      showMsg('Бүртгэл алдаа: ' + e.message);
      setLoading('regBtn', false);
    }
  });

  // Enter key support
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const isLogin = !document.getElementById('login-tab').hidden;
    document.getElementById(isLogin ? 'loginBtn' : 'regBtn').click();
  });
</script>
</body>
</html>
